<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Oracle EBS R12.2 · LLM Wiki</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◆</span>
      <span class="brand-text">EBS <b>LLM Wiki</b></span>
    </div>
    <div class="global-search">
      <input id="global-q" type="search" placeholder="搜索知识，如：销售订单 状态、WIP 倒冲…" autocomplete="off">
      <button id="global-search-btn" aria-label="搜索">⌕</button>
    </div>
    <div class="top-actions">
      <span id="health" class="pill">…</span>
      <button id="theme-toggle" class="icon-btn" title="切换主题">🌙</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="主导航">
    <button data-tab="browse" class="active" role="tab">🔍 检索</button>
    <button data-tab="graph" role="tab">🕸️ 知识图谱</button>
    <button data-tab="ask" role="tab">💬 提问</button>
    <button data-tab="ingest" role="tab">➕ 补充知识</button>
  </nav>

  <main>
    <!-- ============ browse ============ -->
    <section id="tab-browse" class="tab active" role="tabpanel">
      <div class="browse-grid">
        <aside class="panel results-panel">
          <div class="search-row">
            <input id="search-q" type="search" placeholder="输入关键词…" autocomplete="off">
            <label class="chk"><input id="search-raw" type="checkbox"> 官方章节</label>
            <button id="search-btn" class="primary">搜索</button>
          </div>
          <h2 id="results-title">全部页面</h2>
          <div id="results" class="results"></div>
        </aside>
        <section class="panel viewer">
          <h2>页面内容</h2>
          <div id="page-meta" class="meta-line"></div>
          <div id="page-view" class="page-body"><p class="muted">选择左侧页面查看；也可在“知识图谱”中漫游。</p></div>
        </section>
      </div>
    </section>

    <!-- ============ graph ============ -->
    <section id="tab-graph" class="tab" role="tabpanel">
      <div class="graph-toolbar">
        <span class="muted">拖拽节点 · 滚轮缩放 · 点击节点打开页面</span>
        <button id="graph-reload" class="secondary">重新布局</button>
      </div>
      <div class="graph-wrap">
        <canvas id="graph-canvas"></canvas>
        <div id="graph-legend" class="graph-legend"></div>
      </div>
    </section>

    <!-- ============ ask ============ -->
    <section id="tab-ask" class="tab" role="tabpanel">
      <div id="chat" class="chat" aria-live="polite">
        <div class="msg assistant">
          <div class="avatar">🤖</div>
          <div class="bubble">你好，我是知识库助手。可以问我 Oracle EBS 的业务流程、状态机、事务规则、账户推导等问题。</div>
        </div>
      </div>
      <div class="ask-bar">
        <textarea id="ask-q" rows="2" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
        <label class="chk"><input id="ask-raw" type="checkbox" checked> 含官方章节</label>
        <button id="ask-btn" class="primary">发送</button>
      </div>
    </section>

    <!-- ============ ingest ============ -->
    <section id="tab-ingest" class="tab" role="tabpanel">
      <div class="ingest-grid">
        <form id="ingest-form" class="panel">
          <h2>补充知识</h2>
          <label>标题（必填）<input id="in-title" type="text" placeholder="如：XX 模块配置要点"></label>
          <label>来源 URL（选填）<input id="in-url" type="text" placeholder="https://…"></label>
          <label>内容（必填，建议附原文/章节证据）
            <textarea id="in-content" rows="10" placeholder="粘贴知识内容…"></textarea>
          </label>
          <div class="form-actions">
            <button type="submit" class="primary">保存到待摄入箱</button>
            <span id="in-result" class="muted"></span>
          </div>
          <p class="muted small">保存后写入 <code>sources/inbox/</code> 并追加到 wiki/log.md，之后可让 Codex 正式摄入。</p>
        </form>
        <aside class="panel">
          <h2>待摄入箱</h2>
          <div id="inbox-list" class="results"></div>
        </aside>
      </div>
    </section>
  </main>

  <footer class="muted small">
    Oracle EBS R12.2 标品文档知识库 · 本地服务 · 未经实例验证的内容均已标注留白
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
